syntax="proto3";

package otp.v1;

option go_package="github.com/kaelorin/contracts/otp/v1;otp";

import "otp/v1/type.proto";
service Service {
  rpc Issue(IssueRequest) returns (IssueResponse);
  rpc Reissue(ReissueRequest) returns (ReissueResponse);
  rpc Verify(VerifyRequest) returns (VerifyResponse);
}