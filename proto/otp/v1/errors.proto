syntax="proto3";

package otp.v1;

option go_package="github.com/kaelorin/contracts/otp/v1;otp";

import "google/protobuf/timestamp.proto";


enum ErrorCode {
  ERROR_CODE_UNSPECIFIED          = 0;
  ERROR_CODE_MAX_ATTEMPT_EXCEEDED = 1;
  ERROR_CODE_MAX_RESEND_EXCEEDED  = 2;
  ERROR_CODE_OTP_INVALID          = 3;
  ERROR_CODE_SESSION_INVALID      = 4;
  ERROR_CODE_INTERNAL_SERVER      = 5;
  ERROR_CODE_COOLDOWN_ACTIVE      = 6;
  ERROR_CODE_LOCKED               = 7;
}

message ErrorDetail {
  ErrorCode                 code           = 1;
  google.protobuf.Timestamp cooldown_until = 2;
  google.protobuf.Timestamp lock_until     = 3;

  int32 remaining_attempts = 4;
  int32 remaining_resends  = 5;
}