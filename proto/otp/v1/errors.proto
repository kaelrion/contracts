syntax="proto3";

package otp.v1;

option go_package="github.com/Newcode05/contracts/otp/v1;otp";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";


enum ErrorCode {
  ERROR_CODE_UNSPECIFIED   = 0;
  OTP_INVALID              = 1;
  OTP_EXPIRED              = 2;
  OTP_MAX_ATTEMPT_EXCEEDED = 3;
  OTP_MAX_ATTEMPT_RESEND   = 4;
  SESSION_NOT_FOUND        = 5;
  INTERNAL_SERVER          = 6;
  COOLDOWN_ACTIVE          = 7;
  LOCKED                   = 8;
}

message ErrorDetail {
  ErrorCode                 Code           = 1;
  google.protobuf.Timestamp cooldown_until = 2;
  google.protobuf.Timestamp lock_until     = 3;

  int32 remaining_attempts = 4;
  int32 remaining_resends  = 5;
}