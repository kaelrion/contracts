syntax="proto3";

package otp.v1;

option go_package="github.com/kaelorin/contracts/otp/v1;otp";

import "google/protobuf/timestamp.proto";


message IssueRequest {
  string purpose    = 1;
  string channel    = 2;
  string identifier = 3;
}

message IssueResponse {
  google.protobuf.Timestamp otp_expires_at        = 4;
  google.protobuf.Timestamp resend_cooldown_until = 5;
}

message ReissueRequest {
  string purpose    = 1;
  string channel    = 2;
  string identifier = 3;
}

message ReissueResponse {
  google.protobuf.Timestamp otp_expires_at        = 5;
  google.protobuf.Timestamp resend_cooldown_until = 6;
}

message VerifyRequest {
  string purpose    = 1;
  string channel    = 2;
  string identifier = 3;
  string otp_code   = 4;
}

message VerifyResponse {
  bool verified = 1;
}