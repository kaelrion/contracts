syntax="proto3";

package chat.v1;

option go_package = "github.com/kaelorin/chat";
import "chat/v1/type.proto";

service Service {
  rpc SendMessageText(SendMessageTextRequest) returns (SendMessageTextResponse);
  rpc SendMessageWithAttachment(SendMessageWithAttachmentRequest) returns (SendMessageWithAttachmentResponse);
  rpc GetListLatestMessages(GetListLatestMessagesRequest) returns (GetListLatestMessagesResponse);

  rpc GetListConversations(GetListConversationsRequest) returns (GetListConversationsResponse);
  rpc GetGroupConversationMembers(GetGroupConversationMembersRequest) returns (GetGroupConversationMembersResponse);
  rpc GetConversationDetail(GetConversationDetailRequest) returns (GetConversationDetailResponse);

  rpc GetListParticipants(GetListParticipantsRequest) returns (GetListParticipantsResponse);

  rpc GetListConversationsDetail(GetListConversationsDetailRequest) returns (GetListConversationsDetailResponse);
}