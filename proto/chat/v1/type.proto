syntax="proto3";

package chat.v1;

option go_package = "github.com/kaelorin/chat";
import "google/protobuf/timestamp.proto";
message Text {
  string content = 1;
}

message Attachment {
  string             name          = 1;
  int64              size          = 2;
  string             content_type  = 3;
  optional int64     width         = 4;
  optional int64     height        = 5;
  optional int64     duration_ms   = 6;
  map<string,string> user_metadata = 7;
}

message Part {
  string type = 1;
  oneof content {
    Text       text       = 2;
    Attachment attachment = 3;
  }
  int32 position = 4;
}

message SendMessageTextRequest {
  string          sender_id           = 1;
  string          conversation_id     = 2;
  optional string reply_to_message_id = 3;
  repeated Part   parts               = 4;
  string          client_id           = 5;
}

message SendMessageTextResponse {
  string conversation_id = 1;
  string message_id      = 2;
  string state           = 3;
  string client_id       = 4;
}

message SendMessageWithAttachmentRequest {
  string          sender_id           = 1;
  string          conversation_id     = 2;
  optional string reply_to_message_id = 3;
  repeated Part   parts               = 4;
  string          client_id           = 5;
}

message SendMessageWithAttachmentPart {
  string          id       = 1;
  string          type     = 2;
  optional Text   text     = 3;
  optional string token    = 4;
  int32           position = 5;

}

message SendMessageWithAttachmentResponse {
  string                                 conversation_id = 1;
  string                                 message_id      = 2;
  string                                 state           = 3;
  repeated SendMessageWithAttachmentPart parts           = 4;
  string                                 client_id       = 5;
}

message LatestMessageText {
  string content = 1;
}

message LatestMessageAttachment {
  string media_id = 1;
  string name     = 2;
}

message LatestMessagePart {
  string id       = 1;
  int32  position = 2;
  oneof content {
    LatestMessageText       text       = 3;
    LatestMessageAttachment attachment = 4;
  }
  string type = 5;
}

message LatestMessage {
  string                     id                  = 1;
  string                     sender_id           = 2;
  optional string            reply_to_message_id = 3;
  repeated LatestMessagePart parts               = 4;
  string                     status              = 5;
  google.protobuf.Timestamp  created_at          = 6;
}

message GetListLatestMessagesRequest {
  string conversation_id = 1;
  int64  limit           = 2;
}

message GetListLatestMessagesResponse {
  repeated LatestMessage messages    = 1;
  string                 next_cursor = 2;
}